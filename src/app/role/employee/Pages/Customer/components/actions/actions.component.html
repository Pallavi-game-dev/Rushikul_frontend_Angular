<span class="action-icons">
    <button title="Edit" mat-icon-button aria-label="Edit" (click)="editData()">
        <mat-icon color="primary" aria-label="Example home icon">edit</mat-icon>
    </button>
    <button title="Deactivate" mat-icon-button aria-label="Delete" (click)="deactivate()" *ngIf="params.data.enabled"> 
        <mat-icon style="color: red;" aria-label="Example edit icon">block</mat-icon>
    </button>
    <button title="Reactivate" mat-icon-button aria-label="Reactivate" (click)="reactivate()" *ngIf="!params.data.enabled">
        <mat-icon style="color: rgb(2, 143, 25);">refresh</mat-icon>
    </button>

</span>
