<div class="selectOption">
  <mat-form-field [appearance]="appearance" [class.mat-focused]="focused">
    <mat-select (selectionChange)="selection($event)" [placeholder]="placeholder" [value]="selected"
      [disabled]="disabled" aria-label="{{placeholder}}">
      <mat-option *ngFor="let item of items" [value]="bindValueKey ? item[bindValueKey] : item">
        {{ bindLabelKey ? item[bindLabelKey] : item }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>
